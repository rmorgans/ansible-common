---
# Required vars:
# github_actions_self_hosted_runner_install_url: "https://github.com/org/repo"
# github_actions_self_hosted_runner_install_token: "registration-token"

github_actions_self_hosted_runner_install_version: "2.333.1"
github_actions_self_hosted_runner_install_cache_server_version: "latest"
github_actions_self_hosted_runner_install_dir: "/opt/github-runner"
github_actions_self_hosted_runner_install_cache_dir: "/opt/github-runner-cache"
github_actions_self_hosted_runner_install_user: "github-action-runner"
github_actions_self_hosted_runner_install_cache_port: 3000
# Where the cache server's port is published. The runner reaches it at
# localhost only, so "127.0.0.1" keeps it, and the cache entries later jobs
# restore, off the LAN and the tailnet.
github_actions_self_hosted_runner_install_cache_bind_address: "0.0.0.0"
github_actions_self_hosted_runner_install_cache_cleanup_older_than_days: 90
github_actions_self_hosted_runner_install_labels: []
github_actions_self_hosted_runner_install_runner_group: "Default"
github_actions_self_hosted_runner_install_skip_registration: false
github_actions_self_hosted_runner_install_force_reinstall: false
